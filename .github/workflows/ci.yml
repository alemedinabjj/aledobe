name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, unit & e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aledobe
          POSTGRES_PASSWORD: aledobe
          POSTGRES_DB: aledobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aledobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aledobe:aledobe@localhost:5432/aledobe_test?schema=public
      DIRECT_URL: postgresql://aledobe:aledobe@localhost:5432/aledobe_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-0123456789
      FRONTEND_URL: http://localhost:5173
      API_URL: http://localhost:3000/api
      AUTH_DEV_LOGIN: "true"
      RATE_LIMIT_PER_MINUTE: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Forbid unsafe raw SQL
        run: |
          if grep -rnE '\$(queryRawUnsafe|executeRawUnsafe)' src; then
            echo "::error::Unsafe raw SQL is not allowed"; exit 1
          fi
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    name: Frontend · typecheck, unit & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check "apps/*/src/**/*.{ts,tsx,css}" "packages/*/src/**/*.{ts,tsx,css}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: /api
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    name: E2E · docker compose + Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      AUTH_DEV_LOGIN: "true"
      NODE_ENV: development
      JWT_SECRET: ci-only-secret-that-is-long-enough-0123456789
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null http://localhost:8080/editor/remoteEntry.js
          curl -fsSI http://localhost:8080/ | grep -i "content-security-policy"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
